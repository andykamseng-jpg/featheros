name: Build Feather for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag; leave blank to increment the latest release"
        required: false
        type: string
      publish_release:
        description: "Publish the release (automatic main pushes always publish)"
        required: false
        default: false
        type: boolean

concurrency:
  group: featheros-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      FEATHER_SIGNING_CERT_BASE64: ${{ secrets.FEATHER_SIGNING_CERT_BASE64 }}
      FEATHER_SIGNING_CERT_PASSWORD: ${{ secrets.FEATHER_SIGNING_CERT_PASSWORD }}
    outputs:
      suffix: ${{ steps.bundle.outputs.suffix }}
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare release version
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = $env:REQUESTED_TAG
          if (-not $tag) {
            $latestTag = gh api repos/andykamseng-jpg/featheros/releases/latest --jq .tag_name
            if ($LASTEXITCODE -ne 0 -or -not $latestTag) { throw "Could not read the latest FeatherOS release." }
            if ($latestTag -notmatch '^v?(\d+)\.(\d+)\.(\d+)$') { throw "Latest release tag is not semantic versioning: $latestTag" }
            $major = [int]$Matches[1]
            $minor = [int]$Matches[2]
            $patch = [int]$Matches[3] + 1
            $tag = "v$major.$minor.$patch"
          }
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') { throw "Release tag must be vMAJOR.MINOR.PATCH." }
          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $existingTags = gh release list --limit 100 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw "Could not verify that release tag $tag is unused." }
          if ($existingTags -contains $tag) { throw "Release $tag already exists." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Set packaged Feather version
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          "FEATHER_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build self-contained Windows apps
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          pyinstaller --clean --noconfirm --distpath dist/prep build/windows/FeatherPrep.spec
          $env:FEATHER_MCP_BUILD = "1"
          pyinstaller --clean --noconfirm --distpath dist/mcp build/windows/FeatherPrep.spec
          Remove-Item Env:FEATHER_MCP_BUILD
      - name: Sign with the configured trusted RSA code-signing certificate
        if: ${{ env.FEATHER_SIGNING_CERT_BASE64 != '' && env.FEATHER_SIGNING_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "feather-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:FEATHER_SIGNING_CERT_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw "Windows SDK SignTool was not found." }
          foreach ($app in @("dist/prep/FeatherPrep/FeatherPrep.exe", "dist/mcp/FeatherMCP/FeatherMCP.exe")) {
            & $signTool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /f $certificatePath /p $env:FEATHER_SIGNING_CERT_PASSWORD $app
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $app." }
            & $signTool verify /pa /all $app
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $app." }
          }
      - name: Build per-user installer
        id: bundle
        shell: pwsh
        run: |
          $signed = $env:FEATHER_SIGNING_CERT_BASE64 -and $env:FEATHER_SIGNING_CERT_PASSWORD
          $suffix = if ($signed) { "signed" } else { "unsigned-development" }
          choco install innosetup --yes --no-progress
          @"
          # Feather Prep Windows build

          FeatherOS-Setup.exe installs Feather Prep and FeatherMCP with their runtime files in per-user subfolders. Python is included, so a separate Python install is not needed.

          FeatherPrep starts Feather inside your current Windows session and performs a read-only hardware inventory. It does not format, partition, or replace Windows.

          Feather Prep signature verified: $signed

          Unsigned development installers and apps may be blocked by Smart App Control. Do not disable Windows protection to run this build. A release for protected Windows devices needs a valid RSA code-signing certificate from a trusted provider.

          Source editing takes effect in the stored source tree and may need a rebuilt app to run. Hardware is scanned automatically; the bounded report is sent to the configured Vercel registry by default. Feather Prep checks official GitHub releases once when it starts. Version 0.6.10 removes the legacy 30-minute Windows task during installation to prevent duplicate update attempts. Downloads are verified against the GitHub-published SHA-256 digest before Setup runs. This 0.6.8 recovery release keeps Python runtime files beside the app instead of extracting them to Temp. If an earlier Feather Prep shows a python312.dll startup error, run this installer once to repair it. The sharing checkbox can stop and remove a device report. AI input will be designed for the later installed OS stage.
          "@ | Set-Content -Encoding UTF8 dist/README-Windows.txt
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found." }
          $releaseVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Release tag must be vMAJOR.MINOR.PATCH." }
          $agentVersion = python -c "from agent import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0 -or $agentVersion -ne $releaseVersion) {
            throw "Release tag version $releaseVersion must match the agent version $agentVersion."
          }
          & $compiler /Qp "/DAppVersion=$releaseVersion" build/windows/FeatherOS.iss
          if ($LASTEXITCODE -ne 0) { throw "The FeatherOS installer build failed." }
          if ($signed) {
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            & $signTool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /f (Join-Path $env:RUNNER_TEMP "feather-signing.pfx") /p $env:FEATHER_SIGNING_CERT_PASSWORD `
              dist/FeatherOS-Setup.exe
            if ($LASTEXITCODE -ne 0) { throw "Signing the installer failed." }
            & $signTool verify /pa /all dist/FeatherOS-Setup.exe
            if ($LASTEXITCODE -ne 0) { throw "The installer signature could not be verified." }
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "feather-signing.pfx"
          if (Test-Path $certificatePath) { Remove-Item $certificatePath -Force }
          Compress-Archive -Path dist/FeatherOS-Setup.exe,dist/README-Windows.txt `
            -DestinationPath "FeatherOS-Setup-$suffix.zip" -Force
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: FeatherOS-Setup-${{ steps.bundle.outputs.suffix }}
          path: |
            FeatherOS-Setup-*.zip
            dist/FeatherOS-Setup.exe
            dist/README-Windows.txt
          if-no-files-found: error

  publish-release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FeatherOS-Setup-${{ needs.build.outputs.suffix }}
          path: release-files
      - name: Publish downloadable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          $notes = @"
          FeatherOS Feather Prep $env:RELEASE_TAG (early test build).

          This per-user installer runs inside Windows and performs a read-only hardware scan. It does not erase Windows or prepare a bootable FeatherOS system.

          This recovery release installs the Python runtime beside Feather Prep instead of extracting it into a temporary _MEI folder. If an earlier build fails with a python312.dll startup error, install this release once to restore the automatic updater.

          This development build is unsigned unless a trusted RSA signing certificate was configured in repository Actions secrets. Smart App Control may block the unsigned build. The public source repository contains the Windows build workflow and scan code.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP "feather-release-notes.txt"
          $notes | Set-Content -Encoding UTF8 $notesPath
          $installerPath = Get-ChildItem "release-files" -Filter "FeatherOS-Setup.exe" -File -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          $readmePath = Get-ChildItem "release-files" -Filter "README-Windows.txt" -File -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $installerPath -or -not $readmePath) { throw "The built installer or release notes were not found in the downloaded artifact." }
          gh release create $env:RELEASE_TAG `
            $installerPath $readmePath `
            --title "FeatherOS $env:RELEASE_TAG" `
            --notes-file $notesPath `
            --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed." }
